<Directory /home/mike/palaeo-dinodb-marsh/htdocs>
  AllowOverride AuthConfig
</Directory>

<VirtualHost *:80>
  ServerName marsh.dinodb.com
  DocumentRoot /home/mike/palaeo-dinodb-marsh/htdocs
  <Directory /home/mike/palaeo-dinodb-marsh/htdocs>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>
  RewriteEngine on
  RewriteCond %{SERVER_NAME} =marsh.dinodb.com
  RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
