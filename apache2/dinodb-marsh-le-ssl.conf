<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerName   www.miketaylor.org.uk
<Directory /home/mike/web/www.miketaylor.org.uk/htdocs>
  Options Indexes FollowSymLinks
  Require all granted
</Directory>
<Files *.mp4>
  ForceType application/octet-stream
  Header set Content-Disposition attachment
</Files>
DocumentRoot /home/mike/web/www.miketaylor.org.uk/htdocs
ErrorLog     /var/log/apache2/miketaylor.org.uk-error.log
LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" proxy
CustomLog "/var/log/apache2/miketaylor.org.uk-access.log" proxy

ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
Alias /awstats-icon/ /usr/share/awstats/icon/
Alias /awstatsclasses/ /usr/share/java/awstats/
<Directory /usr/lib/cgi-bin/>
	AuthType Basic
	AuthName "Web statistics"
	AuthUserFile /home/mike/web/www.miketaylor.org.uk/htpasswd.awstats
	Require user awstats
</Directory>


SSLCertificateFile /etc/letsencrypt/live/marsh.dinodb.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/marsh.dinodb.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
