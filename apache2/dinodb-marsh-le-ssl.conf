<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerName   miketaylor.org.uk
Redirect permanent / http://www.miketaylor.org.uk/

SSLCertificateFile /etc/letsencrypt/live/marsh.dinodb.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/marsh.dinodb.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
