<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName marsh.dinodb.com
  DocumentRoot /home/mike/palaeo-dinodb-marsh/htdocs
  <Directory /home/mike/palaeo-dinodb-marsh/htdocs>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  SSLCertificateFile /etc/letsencrypt/live/marsh.dinodb.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/marsh.dinodb.com/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
